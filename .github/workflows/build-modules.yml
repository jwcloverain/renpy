name: Build Ren'Py modules

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-modules:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Ren'Py
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ python3-dev python3-venv pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev \
            libfreetype6-dev libfribidi-dev libharfbuzz-dev libglew-dev libpng-dev libjpeg-dev zlib1g-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-gfx-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Create build environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "Cython<3" future six typing pefile requests ecdsa
          git clone --depth 1 https://github.com/renpy/pygame_sdl2.git "$RUNNER_TEMP/pygame_sdl2"
          python "$RUNNER_TEMP/pygame_sdl2/setup.py" install
          python "$RUNNER_TEMP/pygame_sdl2/setup.py" install_headers

      - name: Compile native modules
        env:
          RENPY_DEPS_INSTALL: /usr:/usr/lib/x86_64-linux-gnu
          RENPY_CYTHON: cython
        run: |
          . .venv/bin/activate
          python module/setup.py build --build-base "$GITHUB_WORKSPACE/build/renpy-modules"

      - name: Upload compiled modules
        uses: actions/upload-artifact@v4
        with:
          name: renpy-modules-linux-x86_64
          path: build/renpy-modules
          if-no-files-found: error
